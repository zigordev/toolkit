name: CI

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pipeline:
    name: Pipeline
    uses: zigordev/toolkit/.github/workflows/check.yml@3a438fe285b7fbec6200838b932037a92a4318e4 # v1.34.1
    with:
      product-folder: .
    permissions:
      contents: read
      security-events: write

  check:
    name: check
    needs: [pipeline]
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Pass only when every job passed
        env:
          RESULT: ${{ needs.pipeline.result }}
        run: |
          echo "The pipeline ended with: $RESULT"
          test "$RESULT" = "success"

  publish:
    name: Publish
    needs: [check]
    if: github.event_name == 'push'
    uses: zigordev/toolkit/.github/workflows/publish.yml@3a438fe285b7fbec6200838b932037a92a4318e4 # v1.34.1
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

  deploy:
    name: Deploy
    needs: [publish]
    if: github.event_name == 'push'
    uses: zigordev/toolkit/.github/workflows/deploy.yml@3a438fe285b7fbec6200838b932037a92a4318e4 # v1.34.1
    with:
      target: template
      health-url: https://template.zigordev.com/health
    secrets:
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
    permissions:
      contents: read
      id-token: write
      attestations: read
