name: template

services:
  template-api:
    image: ghcr.io/zigordev/template-api:${VERSION:-local}
    restart: unless-stopped
    user: "1000:1000"
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 30s
    mem_limit: 256m
    cpus: 1
    environment:
      PORT: "3000"
      OTEL_SERVICE_NAME: template-api
      OTEL_SERVICE_VERSION: ${VERSION:-local}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4318
      DATABASE_URL: postgresql://template_api:${TEMPLATE_API_DATABASE_PASSWORD:-}@template-postgres:5432/template_api
      API_KEYS: ${TEMPLATE_API_KEYS:-}
      KAFKA_BROKERS: kafka:9092
      KAFKA_USERNAME: template-api
      KAFKA_PASSWORD: ${KAFKA_PASSWORD:-}
    depends_on:
      template-api-migrate:
        condition: service_completed_successfully
    tmpfs:
      - /tmp:uid=1000,gid=1000,size=1m
    healthcheck:
      test:
        [
          CMD-SHELL,
          "test ! -e /tmp/drain && wget -q -T 4 -O /dev/null http://127.0.0.1:3000/health",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 2s
    labels:
      traefik.enable: "true"
      traefik.http.services.template-api.loadbalancer.server.port: "3000"
      docker-rollout.pre-stop-hook: "touch /tmp/drain && sleep 35"
    networks: [zigordev, template]

  template-api-migrate:
    image: ghcr.io/zigordev/template-api:${VERSION:-local}
    command: [node, src/migrate.ts]
    user: "1000:1000"
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: "no"
    mem_limit: 128m
    cpus: 1
    environment:
      OTEL_SERVICE_NAME: template-api-migrate
      OTEL_SERVICE_VERSION: ${VERSION:-local}
      DATABASE_URL: postgresql://template_api:${TEMPLATE_API_DATABASE_PASSWORD:-}@template-postgres:5432/template_api
      DATABASE_ADMIN_URL: postgresql://postgres:${POSTGRES_PASSWORD:-}@template-postgres:5432/postgres
    labels:
      com.zigordev.job: migrate
    depends_on:
      template-postgres:
        condition: service_healthy
    networks: [zigordev, template]

  template-postgres:
    image: postgres:18.7-alpine3.24@sha256:0115267ab5a509022df9319c77be365cef335adb71556c75f60f5360ee247e71
    restart: unless-stopped
    init: true
    security_opt: [no-new-privileges:true]
    stop_grace_period: 30s
    mem_limit: 256m
    cpus: 1
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - template-postgres-data:/var/lib/postgresql
    healthcheck:
      test: [CMD, pg_isready, --username=postgres, --dbname=postgres]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 1s
    labels:
      com.zigordev.backup: postgres
    networks: [template]

  template-web:
    image: ghcr.io/zigordev/template-web:${VERSION:-local}
    restart: unless-stopped
    user: "1000:1000"
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 30s
    mem_limit: 384m
    cpus: 1
    environment:
      PORT: "3000"
      OTEL_SERVICE_NAME: template-web
      OTEL_SERVICE_VERSION: ${VERSION:-local}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4318
      API_URL: http://template-api:3000
    tmpfs:
      - /tmp:uid=1000,gid=1000,size=1m
      - /app/.next/cache:uid=1000,gid=1000,size=64m
    healthcheck:
      test:
        [
          CMD-SHELL,
          "test ! -e /tmp/drain && wget -q -T 4 -O /dev/null http://127.0.0.1:3000/health",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 2s
    labels:
      traefik.enable: "true"
      traefik.http.services.template-web.loadbalancer.server.port: "3000"
      docker-rollout.pre-stop-hook: "touch /tmp/drain && sleep 35"
    networks: [zigordev]

networks:
  zigordev:
    external: true
  template: {}

volumes:
  template-postgres-data: {}
