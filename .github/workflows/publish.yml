name: Publish

on:
  workflow_call:
    inputs:
      product-folder:
        description: The folder that holds the product's compose.yaml and compose.local.yaml. Each app that compose.local.yaml builds is built for arm64, pushed to GHCR under the commit, and attested.
        type: string
        default: "."

permissions: {}

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    outputs:
      apps: ${{ steps.apps.outputs.apps }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: List the apps that the product builds
        id: apps
        env:
          PRODUCT_FOLDER: ${{ inputs.product-folder }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Images are published from main only, and this run is on $GITHUB_REF."
            exit 1
          fi
          model="$(cd "$PRODUCT_FOLDER" && docker compose --file compose.yaml --file compose.local.yaml config --format json)"
          apps="$(printf '%s' "$model" | jq -c --arg root "$GITHUB_WORKSPACE" '
            [ .services[]
              | select(.build != null and ((.image // "") | startswith("ghcr.io/zigordev/")))
              | (.image | ltrimstr("ghcr.io/zigordev/") | sub(":[^:/]*$"; "")) as $app
              | .build.context as $context
              | {
                  app: $app,
                  context: (
                    if $context == $root then "."
                    elif ($context | startswith($root + "/")) then ($context | ltrimstr($root + "/"))
                    else error("the build context of \($app) lies outside the repo: \($context)")
                    end
                  ),
                  dockerfile: (.build.dockerfile // "Dockerfile")
                }
            ]
            | unique_by(.app)')"
          if [ "$(printf '%s' "$apps" | jq 'length')" = "0" ]; then
            echo "::error::compose.local.yaml in $PRODUCT_FOLDER builds no image of ghcr.io/zigordev/, so there is nothing to publish."
            exit 1
          fi
          wrong="$(printf '%s' "$apps" | jq -r '.[] | select(.app | test("^[a-z0-9]+(-[a-z0-9]+)*$") | not) | .app')"
          if [ -n "$wrong" ]; then
            echo "::error::An app is named <product>-<part> in lowercase letters and digits, and these are not: $wrong"
            exit 1
          fi
          echo "apps=$apps" >> "$GITHUB_OUTPUT"
          {
            echo "| App | Built from |"
            echo "| --- | --- |"
            printf '%s' "$apps" | jq -r '.[] | "| `\(.app)` | `\(.context)/\(.dockerfile)` |"'
          } >> "$GITHUB_STEP_SUMMARY"

  image:
    name: Image ${{ matrix.app }}
    needs: [plan]
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.apps) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Sign in to GHCR
        env:
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ github.token }}
        run: printf '%s' "$TOKEN" | docker login ghcr.io --username "$ACTOR" --password-stdin

      - name: Build the image for arm64, and push it under its commit
        id: build
        env:
          APP: ${{ matrix.app }}
          CONTEXT: ${{ matrix.context }}
          DOCKERFILE: ${{ matrix.dockerfile }}
        run: |
          image="ghcr.io/zigordev/$APP"
          docker buildx build \
            --platform linux/arm64 \
            --provenance=false \
            --sbom=false \
            --file "$CONTEXT/$DOCKERFILE" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "$image:$GITHUB_SHA" \
            --push \
            "$CONTEXT"
          digest="$(docker buildx imagetools inspect "$image:$GITHUB_SHA" --format '{{json .Manifest}}' | jq -r '.digest')"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::GHCR named no digest for $image:$GITHUB_SHA after the push."
            exit 1
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Pushed $image:$GITHUB_SHA, which is $image@$digest"
          echo "| \`$image:$GITHUB_SHA\` | \`$digest\` |" >> "$GITHUB_STEP_SUMMARY"

      - name: Attest that this workflow built the image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.build.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Sign out of GHCR
        if: always()
        run: docker logout ghcr.io
