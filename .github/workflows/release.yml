name: Release

on:
  workflow_call:

permissions: {}

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      version: ${{ steps.plan.outputs.version }}
      publish: ${{ steps.plan.outputs.publish }}
    env:
      LEFTHOOK: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Count the public packages
        id: packages
        run: pnpm exec zigordev release plan

      - name: Tag the next version and write the release notes
        if: steps.packages.outputs.public != '0'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm exec semantic-release

      - name: Plan what to publish
        id: plan
        run: pnpm exec zigordev release plan

  pack:
    name: Pack
    needs: [version]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      LEFTHOOK: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Pack the packages that npm lacks
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: pnpm exec zigordev release pack out "$VERSION"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: out/*.tgz
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish
    needs: [pack]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: out

      - name: Publish each package to npm
        run: |
          for tarball in out/*.tgz; do
            npm publish "$tarball" --access public
          done
