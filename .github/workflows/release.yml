name: Release

on:
  workflow_call:

permissions: {}

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      version: ${{ steps.plan.outputs.version }}
      publish: ${{ steps.plan.outputs.publish }}
    env:
      LEFTHOOK: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Count the public packages, and let npm finish an earlier version
        id: packages
        run: pnpm exec zigordev release plan --settle 420

      - name: Tag the next version and write the release notes
        if: steps.packages.outputs.public != '0'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm exec semantic-release

      - name: Plan what to publish
        id: plan
        run: pnpm exec zigordev release plan

  pack:
    name: Pack
    needs: [version]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      LEFTHOOK: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Pack the packages that npm lacks
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: pnpm exec zigordev release pack out "$VERSION"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: out/*.tgz
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish
    needs: [pack]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: out

      - name: Check that GitHub offers this job its proof of origin
        run: |
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "GitHub offers no proof of origin to this job, so npm cannot know the sender."
            echo "The job and the job that calls this workflow both need the permission id-token: write."
            exit 1
          fi
          echo "GitHub offers its proof of origin to this job."

      - name: Publish each package to npm
        run: |
          for tarball in ./out/*.tgz; do
            npm publish "$tarball" --access public
          done
